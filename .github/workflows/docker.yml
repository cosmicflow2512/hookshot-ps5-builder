name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # woechentlich neu bauen, damit die Arch-Pakete (clang, llvm, mesa-Build-Tools) aktuell bleiben
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hookshot-ps5-builder:latest
            ghcr.io/${{ github.repository_owner }}/hookshot-ps5-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
