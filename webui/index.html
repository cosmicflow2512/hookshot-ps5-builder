<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hookshot PS5 Builder</title>
<style>
  :root { --bg:#111317; --panel:#1a1d23; --line:#2a2f38; --text:#d8dde5; --dim:#8a93a2; --acc:#4cc38a; --err:#e5534b; --warn:#d9a441; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header span { color:var(--dim); }
  main { padding:16px 20px; display:grid; gap:16px; grid-template-columns: 340px 1fr; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; min-width:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; font-weight:600; }
  button { background:#232833; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; cursor:pointer; font:inherit; width:100%; text-align:left; }
  button:hover:not(:disabled) { border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#1f3a2d; border-color:#2f6b4c; }
  button.stop { border-color:#6b2f2f; }
  .btns { display:grid; gap:6px; }
  .btns small { color:var(--dim); display:block; font-size:12px; }
  dl { margin:0; display:grid; grid-template-columns: auto 1fr; gap:4px 10px; font-size:13px; }
  dt { color:var(--dim); } dd { margin:0; word-break:break-all; }
  .repos dd { font-family:ui-monospace, monospace; font-size:12px; }
  #state { font-weight:600; }
  .ok { color:var(--acc); } .bad { color:var(--err); } .run { color:var(--warn); }
  pre { margin:0; height:calc(100vh - 150px); min-height:300px; overflow:auto; background:#0b0d10; border-radius:6px; padding:10px; font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; word-break:break-all; }
  .side { display:grid; gap:16px; align-content:start; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { width:auto; padding:6px 12px; }
  .tabs button.on { border-color:var(--acc); }
  #optview { height:calc(100vh - 150px); min-height:300px; overflow:auto; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0 0 14px; padding:10px 12px; }
  legend { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; padding:0 6px; }
  .opt { display:grid; grid-template-columns: 240px 260px 1fr; gap:4px 14px; padding:8px 0; border-bottom:1px solid #20242c; align-items:start; }
  .opt:last-child { border-bottom:0; }
  @media (max-width: 1100px) { .opt { grid-template-columns: 1fr; } }
  .opt label { font-weight:600; }
  .opt label code { display:block; font-weight:400; color:var(--dim); font-size:11px; }
  .opt select { width:100%; background:#232833; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:5px; font:inherit; }
  .opt select.changed { border-color:var(--warn); }
  .opt .help { color:var(--text); font-size:13px; }
  .opt .note { color:var(--dim); font-size:12px; margin-top:3px; }
  .optbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .optbar button { width:auto; }
  #optmsg { color:var(--dim); }
</style>
</head>
<body>
<header><h1>Hookshot PS5 Builder</h1><span>mihawk-99/PS5_Hookshot &rarr; PPSA99024</span><span id="state">&hellip;</span></header>
<main>
  <div class="side">
    <section>
      <h2>Aktionen</h2>
      <div class="btns">
        <button class="primary" data-stage="all">Alles bauen<small>Aktualisieren und Build</small></button>
        <button data-stage="update">Aktualisieren<small>neuestes PS5_Hookshot-Release und seine Pins</small></button>
        <button data-stage="build">Build<small>ps5/build-title.sh: Toolchain, Lift, Kompilieren, Linken</small></button>
        <button data-stage="deploy">Auf die PS5 kopieren<small>FTP nach /data/homebrew/PPSA99024</small></button>
        <button data-stage="saves-list">Spielstände anzeigen<small>Lichii und Hookshot auf der PS5</small></button>
        <button data-stage="saves">Lichii-Saves übernehmen<small>Hookshot vorher beenden; altes Save wird gesichert</small></button>
        <button class="stop" id="stop">Abbrechen</button>
      </div>
    </section>
    <section>
      <h2>Stand</h2>
      <dl>
        <dt>Spiel</dt><dd id="nup">&ndash;</dd>
        <dt>PS5</dt><dd id="host">&ndash;</dd>
        <dt>Letzter Build</dt><dd id="build">&ndash;</dd>
        <dt>Frei</dt><dd id="free">&ndash;</dd>
      </dl>
    </section>
    <section>
      <h2>Repos</h2>
      <dl class="repos" id="repos"></dl>
    </section>
  </div>
  <section>
    <div class="tabs"><button id="t-log" class="on">Log</button><button id="t-opt">Spieloptionen</button></div>
    <pre id="log"></pre>
    <div id="optview" hidden>
      <div class="optbar">
        <button id="optload">Von der PS5 laden</button>
        <button id="optsave" class="primary">Auf die PS5 schreiben</button>
        <button id="optdefault">Alles auf Standard</button>
        <span id="optmsg">Hookshot vorher beenden: das Spiel liest die Dateien beim Start und schreibt die ini selbst, wenn man im Menü etwas ändert.</span>
      </div>
      <div id="optform"></div>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let next = 0, lastLog = null;
async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }
function fmt(t) { return t ? new Date(t * 1000).toLocaleTimeString('de-DE') : ''; }
async function refresh() {
  try {
    const s = await api('/api/status');
    const st = $('#state');
    if (s.running) { st.textContent = 'läuft: ' + s.stage + ' seit ' + fmt(s.started); st.className = 'run'; }
    else if (s.code === 0) { st.textContent = s.stage + ': fertig ' + fmt(s.ended); st.className = 'ok'; }
    else if (s.code !== null) { st.textContent = s.stage + ': Fehler (Exit ' + s.code + ')'; st.className = 'bad'; }
    else { st.textContent = 'bereit'; st.className = ''; }
    document.querySelectorAll('button[data-stage]').forEach(b => b.disabled = s.running);
    $('#stop').disabled = !s.running;
    $('#nup').textContent = s.nup || 'keine .nup gefunden';
    $('#host').textContent = s.ps5_host || 'PS5_HOST nicht gesetzt';
    $('#build').textContent = s.build || 'noch keiner';
    $('#free').textContent = s.free_gb + ' GB';
    $('#repos').innerHTML = Object.entries(s.repos).map(([k, v]) =>
      '<dt>' + k.replace('PS5_', '') + '</dt><dd>' + (v ? v.replace(/</g, '&lt;') : '&ndash;') + '</dd>').join('');
    if (s.log !== lastLog) { lastLog = s.log; next = 0; $('#log').textContent = ''; }
  } catch (e) { $('#state').textContent = 'keine Verbindung'; }
  try {
    const l = await api('/api/log?from=' + next);
    if (l.text) {
      const pre = $('#log');
      const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
      if (l.next < next) pre.textContent = '';
      pre.textContent += l.text;
      if (pre.textContent.length > 800000) pre.textContent = pre.textContent.slice(-600000);
      if (atEnd) pre.scrollTop = pre.scrollHeight;
    }
    next = l.next;
  } catch (e) {}
}
document.querySelectorAll('button[data-stage]').forEach(b => b.onclick = async () => {
  const r = await api('/api/run?stage=' + b.dataset.stage, { method: 'POST' });
  if (!r.ok) alert(r.msg);
  next = 0; lastLog = null; refresh();
});
$('#stop').onclick = () => api('/api/stop', { method: 'POST' }).then(refresh);
refresh(); setInterval(refresh, 2000);

let cat = null, loaded = {};
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function field(key, title, file, choices, value, def, help, note) {
  const opts = choices.map(([v, t]) => '<option value="' + esc(v) + '"' + (String(v) === String(value) ? ' selected' : '') + '>' +
    esc(t) + (String(v) === String(def) ? ' (Standard)' : '') + '</option>').join('');
  return '<div class="opt"><label>' + esc(title) + '<code>' + esc(file) + ': ' + esc(key) + '</code></label>' +
    '<select data-key="' + esc(key) + '" data-def="' + esc(def) + '">' + opts + '</select>' +
    '<div><div class="help">' + esc(help) + '</div>' + (note ? '<div class="note">' + esc(note) + '</div>' : '') + '</div></div>';
}
function renderOpts(values) {
  const groups = {};
  cat.ini.forEach(o => (groups[o.group] = groups[o.group] || []).push(o));
  let h = '<fieldset><legend>Sprache</legend>' + field('language', 'Spielsprache', 'language.txt', cat.languages,
    values.language || 'en-US', 'en-US', 'Die Sprache von Texten und Menüs des Spiels (die 16 Sprachen, die das Spiel mitbringt).',
    'Wirkt nach einem Neustart des Spiels.') + '</fieldset>';
  for (const g in groups) h += '<fieldset><legend>' + esc(g) + ' (hookshot_options.ini)</legend>' +
    groups[g].map(o => field(o.key, o.title, 'ini', o.choices, values[o.key] ?? o.default, o.default, o.help, o.note)).join('') + '</fieldset>';
  h += '<fieldset><legend>Schalter (hookshot_env.txt)</legend>' +
    cat.env.map(o => field(o.key, o.title, 'env', o.choices, values[o.key] ?? o.default, o.default, o.help, o.note)).join('') + '</fieldset>';
  $('#optform').innerHTML = h;
  document.querySelectorAll('#optform select').forEach(s => s.onchange = () =>
    s.classList.toggle('changed', s.value !== String(loaded[s.dataset.key] ?? s.dataset.def)));
}
async function optLoad() {
  $('#optmsg').textContent = 'Lade von der PS5 ...';
  const r = await fetch('/api/options'); const d = await r.json();
  cat = d;
  if (d.error) { $('#optmsg').textContent = 'PS5 nicht erreichbar (' + d.error + '). Angezeigt: Standardwerte.'; loaded = {}; renderOpts({}); return; }
  loaded = d.values; renderOpts(d.values);
  const miss = Object.entries(d.found).filter(([, v]) => !v).map(([k]) => k);
  $('#optmsg').textContent = 'Geladen.' + (miss.length ? ' Noch nicht auf der PS5: ' + miss.join(', ') + ' (Standardwerte).' : '');
}
async function optSave() {
  const values = {};
  document.querySelectorAll('#optform select').forEach(s => values[s.dataset.key] = /^-?\d+$/.test(s.value) && s.dataset.key !== 'language' && !/^[A-Z]/.test(s.dataset.key) ? parseInt(s.value) : s.value);
  $('#optmsg').textContent = 'Schreibe auf die PS5 ...';
  const r = await fetch('/api/options', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(values) });
  const d = await r.json();
  if (d.error) { $('#optmsg').textContent = 'Fehler: ' + d.error; return; }
  loaded = d.values; renderOpts(d.values);
  $('#optmsg').textContent = 'Gespeichert. Hookshot neu starten, damit es die Werte liest.';
}
$('#optload').onclick = optLoad;
$('#optsave').onclick = optSave;
$('#optdefault').onclick = () => document.querySelectorAll('#optform select').forEach(s => { s.value = s.dataset.def; s.onchange(); });
$('#t-log').onclick = () => { $('#log').hidden = false; $('#optview').hidden = true; $('#t-log').classList.add('on'); $('#t-opt').classList.remove('on'); };
$('#t-opt').onclick = () => { $('#log').hidden = true; $('#optview').hidden = false; $('#t-opt').classList.add('on'); $('#t-log').classList.remove('on'); if (!cat) optLoad(); };
</script>
</body>
</html>
